env_id: "Acrobot-v1"
agent: "dqn"

training:
  n_episodes: 500
  rank_checkpoint_every: 50   # record rank metrics every N episodes
  n_rank_samples: 1024        # states sampled for rank estimation

agent_kwargs:
  hidden: 128
  batch_size: 128
  gamma: 0.99
  lr: 3.0e-4
  tau: 0.005
  eps_start: 0.9
  eps_end: 0.01
  eps_decay: 2500
  buffer_capacity: 10000

analysis:
  hankel_steps: 500
  hankel_n_rows: null          # auto (T // 2)
  value_tensor_bins: 20
  value_tensor_dims: [0, 1, 2, 3]   # θ₁, θ₂, ω₁, ω₂

output:
  save_dir: "outputs/acrobot_dqn"
  save_agent: true
