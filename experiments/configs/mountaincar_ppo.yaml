env_id: "MountainCar-v0"     # 3 discrete actions (left / none / right), reward = -1 per step
agent: "ppo"

training:
  n_episodes: 500
  rank_checkpoint_every: 20
  n_rank_samples: 1600

agent_kwargs:
  hidden: 64
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  ppo_epochs: 4
  mini_batch_size: 64

env_kwargs:
  normalize_obs: true
  discretize_obs: true
  n_state_bins: [40, 40]     # [position, velocity]

analysis:
  hankel_steps: null
  hankel_n_rows: null
  hankel_sequence_types: ["value", "q_taken"]
  value_tensor_bins: null     # null -> use the wrapper's canonical grid (40x40 here)
  value_tensor_dims: [0, 1]   # position, velocity

output:
  save_dir: "outputs/mountaincar_ppo"
  save_agent: true
