experiment:
  name: dqn_frozenlake_hankel
  seed: 52
  device: auto
  save_artifacts: true

environment:
  name: FrozenLake-v1   # 4x4, slippery: 8x8 is beyond eps-greedy DQN's reach
  one_hot_obs: true
  render_mode: null
  discrete_config: null
  normalise:
    action: {}
    state: {}
  clip:
    action: False
    state: []

network:
  hidden_sizes: [128, 128]

agent:
  replay_buffer_capacity: 10000
  batch_size: 128
  nn_learning_rate: 0.0003
  eps_start: 1.0
  eps_min: 0.05
  decay_rate: 0.9999
  discount_factor: 0.95   # short paths; sharper propagation
  TD_LR: 0.005
  buffer_util: 1
  gd_steps_ceil: 1
  grad_clip_norm: 20.0
  hankel_weight: 0.0      # variants override
  hankel_order: 2
  window_len: 8
  n_windows: 8
  gate_threshold: 0.25
  warmup_grad_steps: 0
  ramp_grad_steps: 0

training:
  no_episodes: 6000
  target_network_update_steps: 100
  train_frequency_steps: 8
  use_episode_training: False   # train every train_frequency_steps
  solved_reward: 0.60   # eps-greedy training rate; greedy eval higher
  warmup_steps: 1500
  early_stopping_patience_eps: 50
  no_eps_to_avg: 10

analysis:
  ep_freq: 1000000000
  methods: []
