# Atari-100k protocol config for the FHR-DQN comparison on Freeway.
# Launched by experiments/src/run_fhrdqn_atari100k.py (baseline arm = this
# config with fhr_weight forced to 0; exp<N> arms apply fhr_experiments[N]).
# Protocol references and caveats: src/analysis/atari100k.py.
experiment:
  name: dqn_freeway_fhrdqn100k
  seed: 0
  seeds: [0, 1]          # >= 3 paired seeds per arm; add more if budget allows
  device: auto
  save_artifacts: true
  # Agent recipe: BBFAgent = the BBF recipe (arXiv:2305.19452) on the
  # IQN-dueling stack — Impala-CNN x4 + EMA target + n-step/gamma
  # annealing + shrink-and-perturb resets + DrQ augmentation
  # (src/agents/bbf_agent.py). "efficient_rainbow" selects the previous
  # DrQ-recipe EfficientRainbowAgent + NatureCNNEncoder; "fhrdqn" the
  # legacy plain double-DQN FHRDQNAgent + NatureCNN.
  agent_class: bbf
  # Include this game's runs in the aggregate-HNS comparison against the
  # published methods (only 26-game-suite games are ever aggregated).
  include_in_aggregate: false
  # One FHR parameter set per numbered experiment; unspecified params inherit
  # the agent block. All entries train by default (--experiment N for subsets).
  fhr_experiments:
    1: {fhr_weight: 0.5, fhr_order: 10}
    # 2: {fhr_weight: 0.05, fhr_order: 2, reward_lags: True}   # ARX variant
    # 3: {fhr_weight: 0.2,  fhr_order: 2}

environment:
  name: ALE/Freeway-v5
  render_mode: null
  discrete_config: null
  normalise: {action: {}, state: {}}
  clip: {action: false, state: {}}
  # TRAINING reward: sign-clipped to {-1,0,+1} (Mnih et al.; what every
  # DQN-family Atari-100k baseline trains under). Curves + evaluation report
  # the raw game score via info["raw_reward"].
  reward:
    clip_sign: true
  atari:
    noop_max: 30
    frame_skip: 4
    screen_size: 84
    # Freeway has no lives counter in ALE (single continuous life) —
    # life-loss termination is meaningless here, matching the Enduro config.
    terminal_on_life_loss: false
    episodic_life: false           # no lives counter in this game
    grayscale_obs: true
    grayscale_newaxis: false
    scale_obs: false
    frame_stack: 4
    # Atari-100k benchmark ALE: deterministic (no sticky actions — the v5
    # default 0.25 would make results incomparable to the published numbers)
    # and the per-game minimal action set.
    repeat_action_probability: 0.0
    full_action_space: false

network:
  # bbf recipe: Impala-CNN width multiplier (ImpalaCNNEncoder).
  width_scale: 4
  # fhrdqn recipe only (NatureCNN head width); efficient_rainbow and
  # bbf build their heads from agent.head_hidden and ignore this.
  fc_hidden: 512

agent:
  # DER-style data-efficient settings, uniform across all games so the
  # only per-game difference is the game itself:
  replay_buffer_capacity: 100000    # holds the entire 100k-step run
  batch_size: 32
  nn_learning_rate: 0.0001
  eps_start: 1.0
  eps_min: 0.0
  # bbf: LINEAR eps 1 -> 0 over agent.eps_decay_steps post-warm-up env
  # steps; the exponential decay_rate below is IGNORED by this recipe.
  decay_rate: 0.999079
  discount_factor: 0.997            # BBF gamma END value (annealed from gamma_start)
  TD_LR: 1.0                        # unused by bbf: EMA target inside the agent
  buffer_util: 4
  gd_steps_ceil: 2                  # with train_frequency_steps 1 -> replay ratio 2
  grad_clip_norm: .inf              # BBF trains unclipped (NaN guard still active)
  double: true
  # BBF recipe (official BBF.gin, RR=2 variant) + IQN head sizes:
  n_step: 10                        # annealing START (sample-time aggregation)
  n_step_final: 3                   # annealed 10 -> 3 over anneal_grad_steps
  gamma_start: 0.97                 # annealed to discount_factor (0.997)
  anneal_grad_steps: 10000          # annealing phase after each reset
  target_ema_tau: 0.005             # EMA target per gradient step
  target_action_selection: true     # act with the EMA target network (SR-SPR)
  reset_interval_grad_steps: 40000  # shrink-and-perturb cadence (20k env steps at RR2)
  no_resets_after_grad_steps: 130000 # skip the ~160k-grad-step reset: the final cycle must fully recover (no SPR/PER here)
  shrink_factor: 0.5                # encoder <- 0.5*old + 0.5*random at each reset
  perturb_factor: 0.5
  eps_decay_steps: 2001             # linear eps decay length (env steps, BBF)
  n_quantiles: 8                    # online loss taus (also Double-Q selection)
  n_quantiles_target: 8             # target loss taus
  n_quantiles_act: 32               # fixed-grid taus for acting / analysis traces
  n_quantiles_fhr: 8                # fixed-grid taus for the FHR anchor/lag forward
  n_cos: 64
  head_hidden: 2048                 # BBF hidden_dim
  huber_kappa: 1.0
  use_augmentation: true            # DrQ random shift + intensity, gradient steps only
  aug_pad: 4
  aug_intensity: 0.05
  prioritized_replay: false         # deviation from BBF (PER): uniform episodic replay
  # BBF AdamW: wd 0.1, masked to ndim>=2 params in-agent (biases exempt):
  weight_decay: 0.1
  adam_eps: 0.00015
  amsgrad: false
  torch_compile: true               # compile the IQN quantile path (CUDA only)
  # FHR block (baseline arm overrides fhr_weight to 0):
  fhr_weight: 0.05
  fhr_order: 2
  reward_lags: False
  warmup_grad_steps: 10000          # ~5k env steps of penalty warm-up at replay ratio 2
  c_learning_rate: 0.01

training:
  no_episodes: 100000               # upper bound; max_env_steps ends training
  max_env_steps: 100000             # THE Atari-100k interaction budget
  target_network_update_steps: 1     # no-op for bbf (EMA per gradient step in-agent)
  train_frequency_steps: 1          # one gradient step per env step (post warm-up)
  use_episode_training: False
  solved_reward: 1000000000         # no early stopping under a fixed budget
  warmup_steps: 2000                # BBF's min-replay-history
  early_stopping_patience_eps: 1000000
  no_eps_to_avg: 20

# Final-policy evaluation (raw scores; see evaluate_policy_atari):
# EfficientZero reports 32 episodes; DER/SPR evaluate at eps 0.001.
evaluation:
  episodes: 32
  epsilon: 0.001
  base_seed: 1000

analysis:
  ep_freq: 200                      # a few Hankel ticks across the run
  methods: []                       # pixel inputs -> no state-grid Q matrix
  hankel_sweep:
    enabled: true
    n_rollouts: 1
    base_seed: 52
    functions: [Hankel Q, Hankel V]
    save_trajectories: false
    sub_trajectory:
      enabled: false
      min_len: 8
      stride: 16
      n_figures: 5
