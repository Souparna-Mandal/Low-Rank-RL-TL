# FHR-DQN on CartPole-v1 — learned-recurrence (AR/ARX) penalty, no SVDs.
#
# The penalty rides the TD batch: every sampled transition with at least
# fhr_order same-episode predecessors contributes
#   Huber( Q(s_t,a_t),  sum_j c_j Q(s_{t-j},a_{t-j})  [+ sum_k d_k r_{t-k}] )
# with one global learned coefficient vector, shared across all episodes and
# trained by the same optimiser as the network (own param group). Kronecker's
# theorem makes the zero-residual set exactly the window-Hankel-rank <= r set,
# so this is the SVD-free surrogate for the HR-DQN nuclear-norm penalty.
# fhr_weight: 0.0 turns this file into classical Double-DQN — exactly what the
# comparison notebook's baseline arm overrides (one config, one code path, one
# difference).

experiment:
  name: dqn_cartpole_fhrdqn
  seed: 0                # fallback when `seeds` is absent or empty
  # The comparison notebook trains both arms once per seed and reports
  # seed-averaged curves; each (arm, seed) pair gets its own runs/ directory.
  seeds: [0, 1, 2]
  # CPU: the Q-net is a 2x128 MLP and the penalty is one batched forward plus a
  # length-r matvec — no SVDs, so cuda also works, but CartPole at this size is
  # fastest on CPU.
  device: auto
  save_artifacts: true

environment:
  name: CartPole-v1
  render_mode: null
  discrete_config: null
  normalise:
    action: {}
    state:
      min: [-4.8, -10, -0.41887903, -10,]
      max: [4.8, 10, 0.41887903, 10]
  clip:
    action: False
    state :
      min: [ null, -100, null, -100]
      max: [ null, 100, null, 100]

network:
  # MLP Q-network is defined by the comparison notebook.
  hidden_sizes: [64,64]

agent:
  replay_buffer_capacity: 100000
  batch_size: 128
  nn_learning_rate: 0.0005
  eps_start: 1.0
  eps_min: 0.01
  decay_rate: 0.99992
  discount_factor: 0.99
  TD_LR: 0.3            # soft target-network updates
  buffer_util: 1        # gradient steps/episode ~ len(buffer) / (buffer_util * batch)
  gd_steps_ceil: 40     # hard cap on gradient steps per training call
  grad_clip_norm: 10.0  # max global L2 norm for gradient clipping per step
                        # (network only — the recurrence coefficients are exempt)
  double: True
  # --- FHR learned-recurrence penalty (fhr_weight 0 => exact QAgent) ---
  fhr_weight: 0.5        # lambda on the recurrence residual. NOT transferable
                          # from HRDQN configs: that penalty was a dimensionless
                          # normalised tail, this one carries Q units — re-sweep.
  fhr_order: 2            # r: number of Q-value lags = target Hankel rank.
                          # r=2 is the smallest pure-AR order that can represent
                          # the constant-reward Bellman solution (recurrence
                          # roots {1, 1/gamma}); r=1 without reward_lags has a
                          # provable residual floor at the fixed point.
  reward_lags: False      # True = ARX: also learn d_k on the r preceding
                          # rewards, making the exact Bellman recurrence
                          # representable already at order 1 (c_1 = 1/gamma,
                          # d_1 = -1/gamma is then the init).
  warmup_grad_steps: 500 # hard warm-up K0: lambda = 0 for this many gradient
                          # steps, then full fhr_weight in one step (no ramp) —
                          # early Q is low-rank-but-wrong, so regularising it
                          # from step 0 consolidates bad structure (campaign-
                          # falsified; the warm-up is load-bearing).
  c_learning_rate: 0.05  # lr of the c/d param group: weight_decay 0 (AdamW's
                          # default decay would drag the coefficients toward 0),
                          # excluded from grad clipping and the target network.

training:
  no_episodes: 1500
  target_network_update_steps: 100
  train_frequency_steps: 50
  use_episode_training: True   # one train() call per episode -> one diagnostics row per episode
  solved_reward: 475           # CartPole-v1 solved at >= 475 avg reward
  warmup_steps: 1500
  early_stopping_patience_eps: 50   # solve-ep = first episode whose rolling-50 mean crosses 475
  no_eps_to_avg: 10

analysis:
  # Low-rank Hankel + Q-function diagnostics — ON by default so every
  # comparison run records the mechanism plots (spectra figures show
  # log10(sigma + machine-eps) of the raw value-sequence Hankel; see
  # plot_matrix_spectra in src/analysis/low_rank/rank.py). Set methods: []
  # and hankel_sweep.enabled: false for a faster reward-only run.
  ep_freq: 50
  methods:                         # Q-matrix rank tracking over a state grid
    - name: q_matrix_dqn
      kwargs:
        state_discretisation: [8, 8, 8, 8]   # one bin-count per obs dim
        batch_size: 64
      outputs: [Q-function]
  hankel_sweep:
    enabled: true                  # greedy-rollout Hankel spectra +
                                   # effective-rank evolution in the viewer
    n_rollouts: 3
    base_seed: 52
    functions: [Hankel Q, Hankel V]   # vanilla net => advantage trace is trivial
    save_trajectories: true
    sub_trajectory:
      enabled: false
      min_len: 20
      stride: 20
      n_figures: 5
  autoregressive_value_probe:
    enabled: false                 # <- true for held-out AR-fit quality of the
                                   #    frozen greedy policy's value sequences
    orders: [2, 4]
    n_trajectories: 40
    training_fraction: 0.6
    base_seed: 20000
    ridge_penalty: 1.0e-8
    fit_intercept: false
    forecast_horizons: [1, 2, 4, 8, 16]
    n_example_rollouts: 2
