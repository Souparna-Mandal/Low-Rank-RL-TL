experiment:
  name: dqn_cartpole
  seed: 52
  device: mps

environment:
  name: CartPole-v1
  render_mode: null
  discrete_config: null
  # Verbose normalise kwargs passed straight into make_environment(**env_kwargs).
  # Empty action/state dicts -> RescaleAction / RescaleObservation are skipped.
  normalise:
    action: {}
    state:
      min: [-4.8, -10, -0.41887903, -10,]
      max: [4.8, 10, 0.41887903, 10]
  clip:
    action: False 
    state :
      min: [ null, -100, null, -100]
      max: [ null, 100, null, 100]
network:
  # MLP Q-network is defined inside exp1.ipynb
  hidden_sizes: [128, 128]

agent:
  replay_buffer_capacity: 100000
  batch_size: 128
  nn_learning_rate: 0.0005
  eps_start: 1.0
  eps_min: 0.01
  decay_rate: 0.99991
  discount_factor: 0.99
  TD_LR: 0.01           # soft target-network updates
  buffer_util: 2         # gradient steps/episode ~ len(buffer) / (buffer_util * batch)
  double: True

training:
  no_episodes: 1500
  target_network_update_steps: 10
  train_frequency_steps: 100

analysis:
  ep_freq: 50
  # Each entry: `name` resolves to a callable in the notebook's analysis_methods
  # registry; `kwargs` are the config-supplied args (agent/env are injected at
  # call time by the training loop, so they are never listed here).
  methods:
    - name: hankel_rollout
      kwargs:

        seed: 52
    - name: q_matrix_dqn
      kwargs:
        state_discretisation: [8, 8, 8, 8]   # one bin-count per obs dim (Acrobot obs_dim = 6)
        batch_size: 64
