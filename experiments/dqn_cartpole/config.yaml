experiment:
  name: dqn_cartpole
  seed: 52
  device: auto

environment:
  name: CartPole-v1
  render_mode: null
  discrete_config: null
  # Verbose normalise kwargs passed straight into make_environment(**env_kwargs).
  # Empty action/state dicts -> RescaleAction / RescaleObservation are skipped.
  normalise:
    action: {}
    state:
      min: [-4.8, -10, -0.41887903, -10,]
      max: [4.8, 10, 0.41887903, 10]
  clip:
    action: False 
    state :
      min: [ null, -100, null, -100]
      max: [ null, 100, null, 100]
network:
  # MLP Q-network is defined inside exp1.ipynb
  hidden_sizes: [128, 128]

agent:
  replay_buffer_capacity: 100000
  batch_size: 128
  nn_learning_rate: 0.0005
  eps_start: 1.0
  eps_min: 0.01
  decay_rate: 0.99992
  discount_factor: 0.99
  TD_LR: 0.3           # soft target-network updates
  buffer_util: 1         # gradient steps/episode ~ len(buffer) / (buffer_util * batch)
  # With the current settings when buffer is full it should do 781 gd_steps without the ceiling
  gd_steps_ceil: 40     # hard cap on gradient steps per training call
  grad_clip_norm: 10.0  # max global L2 norm for gradient clipping per step
  double: True

training:
  no_episodes: 1500
  target_network_update_steps: 200
  train_frequency_steps: 100
  use_episode_training: True   # True -> train once at episode end; False -> train mid-episode every train_frequency_steps
  solved_reward: 475         # CartPole-v1 solved at >= 475 avg reward
  warmup_steps: 1500
  early_stopping_patience_eps: 50
  no_eps_to_avg: 10

analysis:
  ep_freq: 50
  # Each entry: `name` resolves to a callable in the notebook's analysis_methods
  # registry; `kwargs` are the config-supplied args (agent/env are injected at
  # call time by the training loop, so they are never listed here).
  methods:
    - name: hankel_rollout
      kwargs:
        seed: 52
      outputs: [Hankel Q, Hankel V]
    - name: q_matrix_dqn
      kwargs:
        state_discretisation: [8, 8, 8, 8]   # one bin-count per obs dim (CartPole obs_dim = 4)
        batch_size: 64
      outputs: [Q-function]
