# SB3 FHR comparison — CartPole-v1, SAC-Discrete (agents/sb3_sac_fhr.SACD:
# Christodoulou 2019 — categorical actor, twin Q(s, .) critics, exact
# expectations, auto-tuned temperature toward target_entropy_scale * log|A|).
#
# There is no stock-SB3 SACD, so the lambda-0 baseline arm IS the reference
# implementation (FHRSACD with the penalty skipped — asserted bit-exact
# against plain SACD by tests/test_sb3_sac_fhr.py). Networks are the standard
# SAC 2x256 (Haarnoja 2018 / SB3 Zoo); cadence is SAC's 1 gradient step per
# env step with tau-0.005 Polyak — the continuously-fresh-target regime the
# MountainCar tuning study showed the FHR edge needs.
#
# The discrete analysis stack (q_matrix, Hankel sweep, AR probe) runs
# unchanged through SB3SACDAdapter: policy_net = min-twin Q rows, greedy =
# argmax pi.
experiment:
  name: sb3_cartpole_sacd
  seed: 44
  seeds: [44, 66]
  fhr_experiments:
    1: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03}
    2: {fhr_weight: 1.0, fhr_order: 2, c_learning_rate: 0.03}
    3: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03, c_predictor: shared}
    4: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03, c_predictor: separate}
    5: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03, prioritized_replay: true}
  device: auto
  save_artifacts: true

environment:
  name: CartPole-v1       # raw env, as the zoo trains it

algo:
  type: sacd
  n_timesteps: 50000
  learning_rate: 1.0e-3   # one lr for actor / critics / alpha, SAC-style
  buffer_size: 100000
  learning_starts: 1000
  batch_size: 256         # SAC default
  gamma: 0.99
  tau: 0.005              # Polyak every step
  target_update_interval: 1
  train_freq: 1           # 1 gradient step per env step (replay ratio 1)
  gradient_steps: 1
  ent_coef: auto
  # H_target = scale * log|A|. Christodoulou's 0.98 is degenerate at |A|=2:
  # it demands H >= 0.679 vs uniform 0.693 (0.014 nats of slack), so any
  # usefully-committed policy sits under target forever, alpha ratchets up
  # without bound (measured: 4.6e7 by 50k steps), the entropy bonus inflates
  # Q and every arm — baseline included — collapses after solving. The
  # scale-0.98 family is archived as sb3_runs_manifest_sacd.scale098.json.
  target_entropy_scale: 0.6    # H_target 0.416: commitment allowed
  net_arch: [256, 256]

agent:
  fhr_weight: 0.5
  fhr_order: 2
  reward_lags: False
  warmup_grad_steps: 2000  # = 2k env steps at the 1:1 cadence
  c_learning_rate: 0.03
  prioritized_replay: false   # shared baseline stays uniform; PER via exp5
  per_alpha: 0.6
  per_beta0: 0.4
  rampdown_reward_threshold: null
  rampdown_penalty_threshold: null
  rampdown_penalty_topk: 20
  rampdown_patience_eps: 10
  rampdown_episodes: 0

training:
  solved_reward: 475
  early_stopping_patience_eps: 50
  no_eps_to_avg: 10
  eval:                   # greedy eval -> eval.csv: deterministic policy on
    freq_steps: 2000      # fixed reset seeds; training stream untouched
    n_episodes: 10
    seed: 9000

analysis:
  ep_freq: 50
  state_bounds:           # finite velocity bounds for the Q-matrix state grid
    low:  [-4.8, -10.0, -0.41887903, -10.0]
    high: [ 4.8,  10.0,  0.41887903,  10.0]
  methods:
    - name: q_matrix_dqn
      kwargs:
        state_discretisation: [8, 8, 8, 8]
        batch_size: 64
      outputs: [Q-function]
  hankel_sweep:
    enabled: true
    n_rollouts: 3
    base_seed: 52
    functions: [Hankel Q, Hankel V]
    save_trajectories: true
    sub_trajectory:
      enabled: false
      min_len: 20
      stride: 20
      n_figures: 5
  autoregressive_value_probe:
    enabled: true
    orders: [2, 4]
    n_trajectories: 40
    training_fraction: 0.6
    base_seed: 20000
    ridge_penalty: 1.0e-8
    fit_intercept: false
    forecast_horizons: [1, 2, 4, 8, 16]
    n_example_rollouts: 2
