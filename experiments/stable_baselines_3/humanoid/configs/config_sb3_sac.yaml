# SB3 FHR comparison - Humanoid-v5 (MuJoCo), stock SAC vs FHRSAC.
#
# Fifth MuJoCo env of the SAC track, the regular locomotion Humanoid (not the
# stand-up variant, which has its own dir). Same 348-dim observation and 17-dim
# action space as HumanoidStandup, but with the two properties that matter to
# FHR reversed: (1) it TERMINATES when the torso z leaves [1.0, 2.0], and a
# random policy falls over in ~30 steps, so early-training episodes are far
# shorter than the order-8 recurrence window - the FHR episodic buffer's
# same-episode predecessor lookup is exercised harder here than on Ant, whose
# early episodes still run tens of steps; (2) the reward is the standard
# locomotion scale (healthy bonus 5/step + forward velocity - control cost), so
# returns are O(1e3)-O(1e4), comparable to HalfCheetah/Ant, and the lambda
# ladder is expected to read the way it did there rather than as it did on
# Standup's O(1e5) Q.
#
# Recipe = RL-Zoo SAC `mujoco-defaults` (Humanoid-v4 block: SB3 SAC defaults +
# learning_starts 10000). The zoo trains Humanoid for 2e6 steps; this family
# runs 1e6 to keep the budget and the arm grid identical to the other four
# MuJoCo envs (HalfCheetah, Ant, Swimmer, HumanoidStandup). The zoo's ~5-6k
# reference score is therefore a 2e6 number - the 1e6 baseline here is
# expected to land below it (SAC on Humanoid is typically ~4-5k at 1e6).
#
# ARM GRID (user-specified): identical lambda x order sweep across the MuJoCo
# envs so the arms are comparable - lambda 0.1 / 1 / 10 x order 2 / 8.
experiment:
  name: sb3_humanoid_sac
  seed: 44
  seeds: [44, 66]
  fhr_experiments:
    # order 2 — the floor
    1: {fhr_weight: 0.1, fhr_order: 2, c_learning_rate: 0.03}
    2: {fhr_weight: 1.0, fhr_order: 2, c_learning_rate: 0.03}
    3: {fhr_weight: 10.0, fhr_order: 2, c_learning_rate: 0.03}
    8: {fhr_weight: 20.0, fhr_order: 2, c_learning_rate: 0.03}
    # order 8 — long recurrence window, same lambda ladder
    4: {fhr_weight: 0.1, fhr_order: 8, c_learning_rate: 0.03}
    5: {fhr_weight: 1.0, fhr_order: 8, c_learning_rate: 0.03}
    6: {fhr_weight: 10.0, fhr_order: 8, c_learning_rate: 0.03}
    7: {fhr_weight: 20.0, fhr_order: 8, c_learning_rate: 0.03}
  # DEVICE: cpu, deliberately. These are 2x256 MLPs with batch 256 - far too
  # small to amortise CUDA kernel-launch latency, so a single SAC process
  # measures ~123 fps on CPU vs ~40 fps on the GB10 GPU, and CPU processes
  # scale near-linearly across the 20 cores while GPU processes contend for
  # one device (7 concurrent CUDA runs fell below 8 fps each). Set per-config
  # rather than repo-wide; the Atari/pixel experiments still want cuda.
  device: cpu
  save_artifacts: true

environment:
  name: Humanoid-v5

algo:                     # RL-Zoo SAC mujoco-defaults
  type: sac
  n_timesteps: 1000000
  learning_rate: 3.0e-4
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  target_update_interval: 1
  train_freq: 1           # SAC cadence: one gradient step per env step
  gradient_steps: 1
  ent_coef: auto
  net_arch: [256, 256]    # standard SAC size (Haarnoja 2018 / zoo)

agent:
  fhr_weight: 0.1         # placeholder; every launched arm overrides
  fhr_order: 2
  reward_lags: False
  warmup_grad_steps: 10000   # penalty active from env step 20000 = 2% of the
                             # budget. Sized in ABSOLUTE gradient steps, not as
                             # a fraction of budget: every prior FHR config in
                             # this repo switches the penalty on between env
                             # step 1.5k and 4k (dqn 256-500, sacd 1000-2000,
                             # pendulum/fetch_reach sac 2000-3000 grad steps) -
                             # the "10% of budget" reading of the two SAC
                             # configs is an artifact of their 20k/30k budgets.
                             # 10% here would mean env step 110000, past the
                             # steepest part of the curve, which is precisely
                             # where FHR's sample-efficiency claim lives.
  c_learning_rate: 0.03
  prioritized_replay: false
  per_alpha: 0.6
  per_beta0: 0.4
  rampdown_reward_threshold: null
  rampdown_penalty_threshold: null
  rampdown_penalty_topk: 20
  rampdown_patience_eps: 10
  rampdown_episodes: 0
  window_rank_every: 1000 # replay-window spectrum probe (wrank) -> rank_stats
                          # window rows + window_hankel.csv: ~1000 ticks over
                          # the 1e6 grad steps, cadence in GRAD steps as in the
                          # ant exp7-10 / mountaincar lagsrc families. Runs for
                          # the baseline too (its curve is the control).
  window_rank_lags: 16    # window length >= what the fhr_order 8 arms need
  grad_ratio_every: 100   # gradient-ratio probe -> train_diagnostics columns
                          # grad_td_norm / grad_pen_norm / grad_ratio_raw /
                          # grad_ratio / grad_cos, every 100 grad steps (1e4
                          # ticks per run, two extra critic backward passes
                          # each). grad_ratio = ||grad(lambda*pen)|| /
                          # ||grad(td)|| over the critic parameters - the
                          # gradient-share counterpart of the loss-share rho
                          # in the notebook's section 4; grad_ratio_raw is the
                          # lambda-free version (measured through warm-up
                          # too), so lambda* = target_share / grad_ratio_raw
                          # reads off directly. FHR arms only (the baseline
                          # never builds the penalty).

training:
  solved_reward: null     # no solved bar on MuJoCo locomotion; no early stop
  early_stopping_patience_eps: null
  no_eps_to_avg: 10
  eval:                   # greedy eval -> eval.csv: deterministic policy on
    freq_steps: 20000     # fixed reset seeds; training stream untouched.
    n_episodes: 5         # up to 1000-step episodes: <= 5k env steps per
    seed: 9000            # eval, 50 eval points over the 1e6 budget

analysis:
  ep_freq: 100            # episodes are short early (falls in tens of steps)
                          # and 1000 steps once upright, so ticks are dense at
                          # the start and ~every 100k steps at the end - same
                          # setting as Ant, the other terminating env.
  methods:
    # continuous-only rollout Hankels: the min-twin critic trace
    # Q(s_t, pi(s_t)) plus each of the 17 action dimensions of pi(s_t)
    - name: hankel_rollout_continuous
      kwargs:
        n_rollouts: 3
        base_seed: 52
      outputs: [Hankel Q rollout, Hankel a0 rollout, Hankel a1 rollout,
                Hankel a2 rollout, Hankel a3 rollout, Hankel a4 rollout,
                Hankel a5 rollout, Hankel a6 rollout, Hankel a7 rollout,
                Hankel a8 rollout, Hankel a9 rollout, Hankel a10 rollout,
                Hankel a11 rollout, Hankel a12 rollout, Hankel a13 rollout,
                Hankel a14 rollout, Hankel a15 rollout, Hankel a16 rollout]
  hankel_sweep:
    enabled: false        # discrete-stack analysis (needs (B, n_actions) rows)
  autoregressive_value_probe:
    enabled: false        # ditto
