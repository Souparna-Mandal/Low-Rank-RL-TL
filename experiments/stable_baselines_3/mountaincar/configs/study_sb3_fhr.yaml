# SB3 FHR Optuna study settings — MountainCar-v0, consumed by
# ../../src/run_sb3_optuna.py (run from this experiment directory) against
# configs/config_sb3_study.yaml. Search space is rho (the weighted-penalty/TD
# contribution ratio; fhr_weight = rho * calibrated td/penalty ratio) and the
# recurrence order — everything else pinned by the study config. Two
# objectives per trial: SPEED (mean env-steps to the threshold ladder, min)
# and FINAL (mean of the last 3 greedy-eval ticks, max), each the seed mean.
study:
  # v2: v1 (sb3_mountaincar_fhr_rho, same journal) used the probe-derived
  # ratio 59.95 — inflated because the baseline barely learns on these seeds
  # (flat Q -> near-zero probe penalty), so rho in [0.1, 100] meant lambda in
  # [6, 6000] and the enqueued known-good arms clipped to the boundary. v2
  # pins the ratio at 2.0, the measured lambda/realized-rho of the completed
  # FHR-active runs (lambda 0.5 -> rho ~0.3, 1.0 -> ~0.35, 0.25 -> ~0.12), so
  # the window is lambda in [0.2, 200] with the good region inside.
  name: sb3_mountaincar_fhr_rho_v2
  seeds: [24, 100, 786, 1000, 9000]
  n_trials: 30
  n_jobs: 1                     # trials sequential; 5 seed-children in flight
  n_startup_trials: 8
  calibration:
    tail_frac: 0.5              # probe-tail medians for the reference ratio
    td_over_penalty_override: 2.0
    reuse_probe_dirs:           # v1's probes (bit-identical to lambda=0)
      - optuna_sb3_fhr/runs/sb3_mountaincar_study_probe_seed24_20260829-212846
      - optuna_sb3_fhr/runs/sb3_mountaincar_study_probe_seed100_20260829-212845
      - optuna_sb3_fhr/runs/sb3_mountaincar_study_probe_seed786_20260829-212846
      - optuna_sb3_fhr/runs/sb3_mountaincar_study_probe_seed1000_20260829-212846
      - optuna_sb3_fhr/runs/sb3_mountaincar_study_probe_seed9000_20260829-212846
  enqueue:                      # known-good arms, converted to rho
    - {fhr_weight: 0.5, fhr_order: 2}   # config_sb3 headline (tuning study)
    - {fhr_weight: 1.0, fhr_order: 2}   # robust-lambda neighbour
    - {fhr_weight: 0.25, fhr_order: 2}  # robust-lambda neighbour

search_space:
  rho: {low: 0.1, high: 100.0, log: true}
  fhr_order: {low: 1, high: 4}

objective:
  # eval.csv greedy curve thresholds: onset / solid progress / solved bar /
  # published zoo final
  thresholds: [-160, -130, -110, -100]
  final_evals: 3                # FINAL = mean of the last 3 eval ticks
