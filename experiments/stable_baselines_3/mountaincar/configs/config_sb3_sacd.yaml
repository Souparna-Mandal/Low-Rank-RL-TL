# SB3 FHR comparison — MountainCar-v0, SAC-Discrete (agents/sb3_sac_fhr.SACD).
#
# Sparse-reward caveat: max-entropy dithering explores MountainCar worse than
# an eps-greedy schedule, so the SACD baseline may not solve reliably — that
# is itself a result, and the PER arm (prioritising the rare successes) is the
# scientifically interesting one here. target_entropy_scale is lowered to 0.5
# so the policy is allowed to commit once value appears; the budget is 200k
# steps (the tuned DQN uses 120k). gamma 0.98 follows the tuned DQN recipe;
# networks are the standard SAC 2x256 (Haarnoja 2018 / SB3 Zoo).
#
# The lambda-0 baseline arm is the SACD reference (no stock-SB3 counterpart
# exists); tau-0.005 Polyak every step is SAC's native regime — exactly the
# continuously-fresh-target setting the MountainCar tuning study showed the
# FHR edge needs.
experiment:
  name: sb3_mountaincar_sacd
  seed: 44
  seeds: [44, 66]
  fhr_experiments:
    1: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03}
    2: {fhr_weight: 1.0, fhr_order: 2, c_learning_rate: 0.03}
    3: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03, c_predictor: shared}
    4: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03, c_predictor: separate}
    5: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03, prioritized_replay: true}
  device: auto
  save_artifacts: true

environment:
  name: MountainCar-v0    # raw obs (the normalise trick hurt in the tuning study)

algo:
  type: sacd
  n_timesteps: 200000
  learning_rate: 1.0e-3
  buffer_size: 50000
  learning_starts: 1000
  batch_size: 256
  gamma: 0.98             # tuned-DQN value for this env
  tau: 0.005
  target_update_interval: 1
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_entropy_scale: 0.5    # low bar: let pi commit on sparse reward
  net_arch: [256, 256]

agent:
  fhr_weight: 0.5
  fhr_order: 2
  reward_lags: False
  warmup_grad_steps: 1000
  c_learning_rate: 0.03
  prioritized_replay: false
  per_alpha: 0.6
  per_beta0: 0.4
  rampdown_reward_threshold: null
  rampdown_penalty_threshold: null
  rampdown_penalty_topk: 20
  rampdown_patience_eps: 10
  rampdown_episodes: 0

training:
  solved_reward: -110     # MountainCar-v0 standard bar
  early_stopping_patience_eps: 50
  no_eps_to_avg: 25
  eval:                   # greedy eval -> eval.csv: deterministic policy on
    freq_steps: 5000      # fixed reset seeds; training stream untouched
    n_episodes: 10
    seed: 9000

analysis:
  ep_freq: 50
  # MountainCar's raw observation space is already bounded — no state_bounds
  methods:
    - name: q_matrix_dqn
      kwargs:
        state_discretisation: [32, 32]
        batch_size: 128
      outputs: [Q-function]
  hankel_sweep:
    enabled: true
    n_rollouts: 3
    base_seed: 52
    functions: [Hankel Q, Hankel V]
    save_trajectories: true
    sub_trajectory:
      enabled: false
      min_len: 20
      stride: 20
      n_figures: 5
  autoregressive_value_probe:
    enabled: true
    orders: [2, 4]
    n_trajectories: 40
    training_fraction: 0.6
    base_seed: 20000
    ridge_penalty: 1.0e-8
    fit_intercept: false
    forecast_horizons: [1, 2, 4, 8, 16]
    n_example_rollouts: 2
