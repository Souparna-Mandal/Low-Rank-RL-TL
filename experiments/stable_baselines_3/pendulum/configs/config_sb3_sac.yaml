# SB3 FHR comparison — Pendulum-v1, SAC (the continuous-action debug env for
# SAC-FHR, RESEARCH_TODO track 2). Recipe = RL-Zoo SAC for Pendulum: defaults
# plus learning_rate 1e-3 and a 20k-step budget (zoo final ~ -156); network
# 2x256 is the standard SAC size (Haarnoja et al. 2018 / SB3 Zoo).
#
# The baseline arm (fhr_weight 0) is bit-for-bit stock SB3 SAC (asserted by
# tests/test_sb3_sac_fhr.py). The FHR penalty rides BOTH critics' TD loss —
# the actor's KL(pi || exp(Q/alpha)) step consumes the regularised critics
# implicitly. Pendulum Q sits around -100s (rewards in [-16.3, 0]), so the
# Huber penalty operates in its linear regime: lambda starts at 0.1, not the
# CartPole-scale 0.5. Watch penalty_raw in train_diagnostics before widening.
#
# analysis.methods uses the continuous-only rollout-Hankel check (Q(s, pi(s))
# trace + the action trajectory pi(s) itself); the discrete grid/row analyses
# (q_matrix, hankel_sweep, AR probe) do not apply to a Box action space.
experiment:
  name: sb3_pendulum_sac
  seed: 44
  seeds: [44, 66]
  fhr_experiments:
    # 1/2: standard FHR, one global c optimised by autodiff
    1: {fhr_weight: 0.1, fhr_order: 2, c_learning_rate: 0.03}
    2: {fhr_weight: 0.5, fhr_order: 2, c_learning_rate: 0.03}
    # 3/4: state-conditioned c(s, a) — "shared" reads the online critic's
    # penultimate features (input already contains the action), "separate" is
    # an own MLP on [obs, raw action]
    3: {fhr_weight: 0.1, fhr_order: 2, c_learning_rate: 0.03, c_predictor: shared}
    4: {fhr_weight: 0.1, fhr_order: 2, c_learning_rate: 0.03, c_predictor: separate}
    # 5: FHR + prioritized replay (proportional PER, IS weights on the TD
    # terms only; the penalty stays an unweighted mean)
    5: {fhr_weight: 0.1, fhr_order: 2, c_learning_rate: 0.03, prioritized_replay: true}
  device: auto
  save_artifacts: true

environment:
  name: Pendulum-v1       # raw env; actions Box(-2, 2), squashed by the policy

algo:                     # RL-Zoo SAC, Pendulum-v1
  type: sac
  n_timesteps: 20000
  learning_rate: 1.0e-3   # zoo (SAC default 3e-4)
  buffer_size: 1000000
  learning_starts: 100
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  target_update_interval: 1
  train_freq: 1           # SAC cadence: one gradient step per env step
  gradient_steps: 1
  ent_coef: auto
  net_arch: [8, 8]    # capacity probe; the 2x256 family is archived as
                      # cached/sb3_runs_manifest_sac_big_network.json

agent:
  fhr_weight: 0.1
  fhr_order: 2
  reward_lags: False
  warmup_grad_steps: 2000  # = 2k env steps at the 1:1 cadence (~10% budget)
  c_learning_rate: 0.03
  prioritized_replay: false   # shared baseline stays stock; PER via exp5
  per_alpha: 0.6
  per_beta0: 0.4
  rampdown_reward_threshold: null
  rampdown_penalty_threshold: null
  rampdown_penalty_topk: 20
  rampdown_patience_eps: 10
  rampdown_episodes: 0

training:
  solved_reward: null     # Pendulum has no standard solved bar; no early stop
  early_stopping_patience_eps: null
  no_eps_to_avg: 10
  eval:                   # greedy eval -> eval.csv: deterministic policy on
    freq_steps: 1000      # fixed reset seeds; training stream untouched
    n_episodes: 10
    seed: 9000

analysis:
  ep_freq: 25             # Pendulum episodes are 200 steps -> ~4 ticks / 20k
  methods:
    # continuous-action-only: stacked rollout Hankels of the min-twin critic
    # trace Q(s_t, pi(s_t)) and of the deterministic action trajectory pi(s_t)
    # — "does the policy itself have a low Hankel rank"
    - name: hankel_rollout_continuous
      kwargs:
        n_rollouts: 3
        base_seed: 52
      outputs: [Hankel Q rollout, Hankel action rollout]
  hankel_sweep:
    enabled: false        # discrete-stack analysis (needs (B, n_actions) rows)
  autoregressive_value_probe:
    enabled: false        # ditto
