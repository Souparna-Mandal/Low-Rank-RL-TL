experiment:
  name: dqn_seaquest
  seed: 52
  device: cuda
  # Save run artifacts (spectra figures, rewards/rank CSVs, checkpoints) under
  # runs/<timestamp>/ instead of rendering analysis figures inline.
  save_artifacts: true

environment:
  name: ALE/Seaquest-v5
  render_mode: null
  discrete_config: null
  normalise:
    action: {}
    state: {}
  clip:
    action: false
    state: {}
  # Standard Mnih et al. (2015) Atari preprocessing — identical pipeline to
  # dqn_pacman/dqn_enduro. terminal_on_life_loss=True: Seaquest gives multiple
  # lives and death (running out of oxygen or getting hit) needs to register as
  # a terminal signal or the agent never learns to surface for air.
  atari:
    noop_max: 30
    frame_skip: 4
    screen_size: 84
    terminal_on_life_loss: true
    grayscale_obs: true
    grayscale_newaxis: false
    scale_obs: false
    frame_stack: 4

network:
  # Nature DQN conv trunk + dueling value/advantage heads (Wang et al. 2016).
  # Seaquest is one of the games where the dueling decomposition helps most:
  # with 18 actions, most actions are irrelevant in most states, so learning
  # V(s) through a dedicated stream is far more sample-efficient than pushing
  # value information through every Q(s,a) head. The explicit V/A streams are
  # also exactly what the Hankel analysis below wants to measure.
  #   Conv(4->32, k=8, s=4) -> ReLU
  #   Conv(32->64, k=4, s=2) -> ReLU
  #   Conv(64->64, k=3, s=1) -> ReLU -> Flatten (3136)
  #   V head: Linear(3136, 512) -> ReLU -> Linear(512, 1)
  #   A head: Linear(3136, 512) -> ReLU -> Linear(512, n_actions)
  #   Q = V + A - mean_a(A)
  fc_hidden: 512

agent:
  # update_buffer_atari stores frame stacks as uint8 on CPU: 2 x 4x84x84 bytes
  # ~ 56 kB per transition -> 500k transitions ~ 28 GB host RAM.
  replay_buffer_capacity: 250000
  batch_size: 128
  nn_learning_rate: 0.0001
  eps_start: 1.0
  eps_min: 0.01
  # Decay tuned so eps ~ 0.01 after ~250k env steps: 0.01 ** (1/250000) ~ 0.999982
  decay_rate: 0.999912
  # Higher than pacman's 0.98: the dive -> collect -> surface-for-oxygen cycle
  # spans hundreds of steps, so credit for surfacing must survive a long horizon.
  discount_factor: 0.99
  TD_LR: 0.005
  buffer_util: 4
  gd_steps_ceil: 30
  grad_clip_norm: 10.0
  double: True

training:
  no_episodes: 15000
  target_network_update_steps: 10
  train_frequency_steps: 40
  use_episode_training: true
  # DQN-family agents typically land 2000-6000 on Seaquest; set high to disable early stop.
  solved_reward: 20000
  warmup_steps: 50000
  early_stopping_patience_eps: 50
  no_eps_to_avg: 20

analysis:
  ep_freq: 100
  # Generic per-matrix analysis methods (name -> callable in analysis/registry.py).
  # Hankel is no longer a method: it runs through hankel_sweep below. Empty here
  # because the discretised-Q analysis for pixels runs post-training (post_methods).
  methods: []
  # Multi-rollout + growing sub-trajectory Hankel analysis. Runs every ep_freq
  # episodes during training and self-logs to the run dir:
  #   hankel_sweep.csv  one row per (rollout, sub_len) of the rank metrics
  #   trajectories/     raw per-step Q/V/A sequences (.npz) per rollout
  #   figures/          n_figures spectra (rollout 0) across the sub-trajectory sweep
  hankel_sweep:
    enabled: true
    n_rollouts: 5                 # rollout r uses seed = base_seed + r
    base_seed: 52
    functions: [Hankel Q, Hankel V, Hankel A]   # dueling net => real V/A streams
    save_trajectories: true
    sub_trajectory:
      enabled: true
      min_len: 20                  # Hankel is meaningless below ~4 steps
      stride: 10                  # prefixes 8, 24, 40, ... up to H (episode length)
      n_figures: 5                # render 5 spectra equally spaced from first prefix to H
  # Heavier discretised-Q analysis, run once post-training in the notebook:
  # rows = states visited by the policy (Yang et al. 2020 construction), plus a
  # latent-space k-means binned variant (the pixel analogue of per-dim bins).
  post_methods:
    - name: q_matrix_rollout
      kwargs:
        no_episodes: 3
        max_states: 16000
        feature_clusters: 128
        seed: 52
      outputs: [Q visited-states, Q latent-binned]
