experiment:
  name: dqn_pacman_hankel
  seed: 52
  device: cuda
  # Save run artifacts (spectra figures, rewards/rank CSVs, checkpoints) under
  # runs/<timestamp>/ instead of rendering analysis figures inline.
  save_artifacts: true

environment:
  name: ALE/MsPacman-v5
  render_mode: null
  discrete_config: null
  normalise:
    action: {}
    state: {}
  clip:
    action: false
    state: {}
  # Standard Mnih et al. (2015) Atari preprocessing — identical pipeline to
  # dqn_enduro. Key difference: terminal_on_life_loss=True because Pac-Man has
  # 3 lives and treating each death as a terminal signal stabilises training
  # (the agent learns not to die rather than ignoring it mid-episode). Note this
  # also means the episodic buffer's episodes (and the engage-latch returns) are
  # per-life, so penalty windows never span a death.
  atari:
    noop_max: 30
    frame_skip: 4
    screen_size: 84
    terminal_on_life_loss: true
    grayscale_obs: true
    grayscale_newaxis: false
    scale_obs: false
    frame_stack: 4

network:
  # Same Nature DQN CNN as dqn_enduro — architecture is game-agnostic and
  # operates on the same (4, 84, 84) uint8 input regardless of game.
  # Defined inside exp1_hankel.ipynb.
  #   Conv(4->32, k=8, s=4) -> ReLU
  #   Conv(32->64, k=4, s=2) -> ReLU
  #   Conv(64->64, k=3, s=1) -> ReLU
  #   Flatten -> Linear(3136, 512) -> ReLU -> Linear(512, n_actions)
  fc_hidden: 512

agent:
  # HankelDQNAgent's episodic buffer stores each frame stack once as uint8 on
  # CPU (~28 kB per transition) -> 250k transitions ~ 7 GB host RAM.
  replay_buffer_capacity: 250000
  batch_size: 128
  nn_learning_rate: 0.0001
  eps_start: 1.0
  eps_min: 0.01
  # Inherited from dqn_pacman/config.yaml for parity with the sibling experiment.
  # NOTE: 0.999998 reaches eps 0.01 only after ~2.3M decayed steps (a 0.999982
  # rate would hit it at ~250k) — most of a 15k-episode run explores at high eps.
  decay_rate: 0.999998
  discount_factor: 0.98
  TD_LR: 0.33
  buffer_util: 4
  gd_steps_ceil: 100
  grad_clip_norm: 20.0
  double: True
  # --- Hankel low-rank regulariser (HankelDQNAgent; hankel_weight 0 => exact QAgent) ---
  hankel_weight: 0.01       # lambda on the truncated singular-value tail
  hankel_order: 2           # target Hankel rank r (r=1 over-compresses; campaign round 4)
  window_len: 20            # sub-trajectory window T (~1.3 s at frame_skip 4); Hankel is 11x10
  n_windows: 8              # penalty windows per gradient step
  gate_threshold: null      # spectral gate OFF: every sampled window feeds the penalty
                            # (a toy Atari run showed gate_frac=1.0 at 0.25 — fully starved)
  warmup_grad_steps: 0      # lambda = 0 for the first grad steps ...
  ramp_grad_steps: 0        # ... then ramps linearly to hankel_weight
  window_half_life: 20      # episodes; recency-bias penalty windows toward current policy

training:
  no_episodes: 15000
  target_network_update_steps: 150
  train_frequency_steps: 150
  use_episode_training: false
  # DQN typically reaches 1000-2500 on Ms. Pac-Man; set high to disable early stop.
  solved_reward: 2000
  warmup_steps: 100000
  early_stopping_patience_eps: 50
  no_eps_to_avg: 10

analysis:
  ep_freq: 100
  # q_matrix_dqn discretises observation dims -> meaningless for pixel inputs, so
  # no generic per-matrix methods here. Hankel runs via hankel_sweep below.
  methods: []
  # Multi-rollout + growing sub-trajectory Hankel analysis (single-run path only;
  # the benchmark grid in exp1_hankel.ipynb strips this down for speed).
  hankel_sweep:
    enabled: true
    n_rollouts: 5
    base_seed: 52
    functions: [Hankel Q, Hankel V]   # vanilla net => advantage trace is trivial
    save_trajectories: false
    sub_trajectory:
      enabled: true
      min_len: 20
      stride: 10
      n_figures: 5

  post_methods:
    - name: q_matrix_rollout
      kwargs:
        no_episodes: 5
        max_states: 16000
        feature_clusters: 128
        seed: 52
      outputs: [Q visited-states, Q latent-binned]
