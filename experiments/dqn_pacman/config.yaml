experiment:
  name: dqn_pacman
  seed: 52
  device: cuda

environment:
  name: ALE/MsPacman-v5
  render_mode: null
  discrete_config: null
  normalise:
    action: {}
    state: {}
  clip:
    action: false
    state: {}
  # Standard Mnih et al. (2015) Atari preprocessing — identical pipeline to
  # dqn_enduro. Key difference: terminal_on_life_loss=True because Pac-Man has
  # 3 lives and treating each death as a terminal signal stabilises training
  # (the agent learns not to die rather than ignoring it mid-episode).
  atari:
    noop_max: 30
    frame_skip: 4
    screen_size: 84
    terminal_on_life_loss: true
    grayscale_obs: true
    grayscale_newaxis: false
    scale_obs: false
    frame_stack: 4

network:
  # Same Nature DQN CNN as dqn_enduro — architecture is game-agnostic and
  # operates on the same (4, 84, 84) uint8 input regardless of game.
  #   Conv(4->32, k=8, s=4) -> ReLU
  #   Conv(32->64, k=4, s=2) -> ReLU
  #   Conv(64->64, k=3, s=1) -> ReLU
  #   Flatten -> Linear(3136, 512) -> ReLU -> Linear(512, n_actions)
  fc_hidden: 512

agent:
  replay_buffer_capacity: 500000
  batch_size: 128
  nn_learning_rate: 0.0001
  eps_start: 1.0
  eps_min: 0.01
  # Decay tuned so eps ~ 0.01 after ~250k env steps: 0.01 ** (1/250000) ~ 0.999982
  decay_rate: 0.999992
  discount_factor: 0.99
  TD_LR: 0.0025
  buffer_util: 4
  gd_steps_ceil: 25
  grad_clip_norm: 10.0
  double: True

training:
  no_episodes: 15000
  target_network_update_steps: 200
  train_frequency_steps: 200
  use_episode_training: false
  # DQN typically reaches 1000-2500 on Ms. Pac-Man; set high to disable early stop.
  solved_reward: 2000
  warmup_steps: 50000
  early_stopping_patience_eps: 50
  no_eps_to_avg: 10

analysis:
  ep_freq: 100
  methods:
    - name: hankel_rollout
      kwargs:
        seed: 52
      outputs: [Hankel Q, Hankel V]