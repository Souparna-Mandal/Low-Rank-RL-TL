experiment:
  name: dqn_mountaincar_hankel
  seed: 52
  device: auto
  save_artifacts: true

environment:
  name: MountainCar-v0
  render_mode: null
  discrete_config: null
  normalise:
    action: {}
    state: {}
  clip:
    action: False
    state: []

network:
  hidden_sizes: [128, 128]

agent:
  replay_buffer_capacity: 50000
  batch_size: 128
  nn_learning_rate: 0.0003
  eps_start: 1.0
  eps_min: 0.1
  decay_rate: 0.99999   # per-step; sustained exploration for the sparse goal
  discount_factor: 0.99
  TD_LR: 0.005
  buffer_util: 1
  gd_steps_ceil: 1
  grad_clip_norm: 20.0
  hankel_weight: 0.0      # variants override
  hankel_order: 2
  window_len: 16
  n_windows: 8
  gate_threshold: 0.25
  warmup_grad_steps: 0
  ramp_grad_steps: 0

training:
  no_episodes: 2500
  target_network_update_steps: 100
  train_frequency_steps: 16
  use_episode_training: False   # train every train_frequency_steps
  solved_reward: -110       # MountainCar-v0 convention
  warmup_steps: 2000
  early_stopping_patience_eps: 50
  no_eps_to_avg: 10

analysis:
  ep_freq: 1000000000
  methods: []
