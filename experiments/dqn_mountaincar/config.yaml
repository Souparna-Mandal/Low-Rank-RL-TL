experiment:
  name: dqn_mountaincar
  seed: 52
  device: auto
  # Save run artifacts (spectra figures, rewards/rank/hankel_sweep CSVs, trajectories,
  # checkpoints) under runs/<timestamp>/ instead of rendering analysis figures inline.
  save_artifacts: true

environment:
  name: MountainCar-v0
  render_mode: null
  discrete_config: null
  # MountainCar's raw observation is [position in [-1.2, 0.6], velocity in
  # [-0.07, 0.07]] — a 14x scale mismatch between the two dims. RescaleObservation
  # maps both to [-1, 1] so the MLP sees comparably scaled features.
  normalise:
    action: {}
    state:
      min: [-1, -1]
      max: [1, 1]
  clip:
    action: False
    state: []

network:
  # MLP Q-network is defined inside exp1.ipynb
  hidden_sizes: [64, 64]

agent:
  replay_buffer_capacity: 100000
  batch_size: 128
  nn_learning_rate: 0.0005
  eps_start: 1.0
  eps_min: 0.05
  decay_rate: 0.99997     # per-step; reaches eps_min around ~100k env steps (~ep 500)
  discount_factor: 0.99
  TD_LR: 0.005           # soft target-network updates (Polyak-style, every 2 steps)
  buffer_util: 1         # gradient steps/episode ~ len(buffer) / (buffer_util * batch)
  gd_steps_ceil: 1       # hard cap on gradient steps per training call
  grad_clip_norm: 20.0   # max global L2 norm for gradient clipping per step
  double: True

training:
  # Reward is -1/step until the flag is reached (max 200 steps), so there is no
  # gradient signal until epsilon-greedy exploration stumbles on the goal —
  # hence the long run, the slow decay and the mid-episode training cadence
  # (the Acrobot recipe, which shares the constant -1/step reward structure).
  no_episodes: 2000
  target_network_update_steps: 2
  train_frequency_steps: 2
  use_episode_training: False   # train mid-episode every train_frequency_steps
  solved_reward: -110           # MountainCar-v0 solved at avg reward >= -110
  warmup_steps: 10000           # pure random prefill (~50 episodes)
  early_stopping_patience_eps: 50
  no_eps_to_avg: 25

analysis:
  ep_freq: 50
  # Each entry: `name` resolves to a callable in analysis/registry.py; `kwargs`
  # are the config-supplied args (agent/env are injected at call time by the
  # training loop, so they are never listed here).
  methods:
    - name: q_matrix_dqn
      kwargs:
        state_discretisation: [32, 32]   # one bin-count per obs dim (MountainCar obs_dim = 2)
        batch_size: 64
      outputs: [Q-function]
  # Multi-rollout greedy Hankel analysis — Q/V sequences along greedy rollouts,
  # spectra + effective-rank logged to runs/<...>/hankel_sweep.csv every ep_freq.
  hankel_sweep:
    enabled: true
    n_rollouts: 10
    base_seed: 52
    functions: [Hankel Q, Hankel V]   # vanilla net => advantage trace is trivial
    save_trajectories: true
    sub_trajectory:
      enabled: false
      min_len: 20
      stride: 20
      n_figures: 5
