// dash patterns distinguishing seeds of one variant in the overlaid view
const DASHES=["","7 4","2 3","9 3 2 3","1 4","12 3"];
function cmpRewardCard(loaded){
  const extract=s=>(s.rewards||[]).map(r=>[r[0],r[1]]);
  // a seed shorter than the rolling window is dropped (and counted) rather
  // than mixed in raw — a jagged unsmoothed curve inside a chart labelled
  // "rolling-N" would read as real signal
  const W=STATE.cmpRollW;
  let dropped=0;
  const transform=STATE.cmpY==="cum"?cumulativePts
    :W>1?(pts=>{if(pts.length>=W)return rollingPts(pts,W);dropped++;return null;}):null;
  const appendDroppedNote=target=>{if(dropped)target.append(el("p",{class:"muted-note",
    text:`${dropped} seed run(s) are shorter than the rolling-${W} window and `
      +"are not drawn — lower the smoothing to see them."}));};
  const yTitle=STATE.cmpY==="cum"?"Cumulative reward"
    :W>1?`Episode return (rolling-${W})`:"Episode return";

  const card=el("div",{class:"card"});
  card.append(el("h2",{text:yTitle}),
    el("p",{class:"desc",text:
      (STATE.cmpY==="cum"
        ?"Total training reward accumulated so far — steeper is better; on the "
         +"env-steps axis a horizontal gap between variants is a sample-efficiency gap"
        :"Training reward per episode")
      +(STATE.cmpX==="steps"
        ?" · against environment steps (samples), so variants whose episodes "
         +"differ in length stay comparable":" · against training episodes")+"."}));

  const vis=loaded.filter(g=>!STATE.cmpHidden.has(g.key));
  if(STATE.cmpView==="mean"){
    const series=cmpSeries(loaded,extract,transform);
    if(!series.length){card.append(el("p",{class:"muted-note",
      text:dropped?`All seed runs are shorter than the rolling-${W} window — `
        +"lower the smoothing.":"No reward data on this axis."}));return card;}
    appendDroppedNote(card);
    card.append(lineChart({series,wide:true,noEndLabel:true,yLabel:yTitle,
      xLabel:cmpXLabel(),xPrefix:cmpXPrefix()}));
    return card;
  }

  const perGroup=vis.map(g=>({g,entries:cmpSeedEntries(g,extract,transform)}))
    .filter(e=>e.entries.length);
  if(!perGroup.length){card.append(el("p",{class:"muted-note",
    text:dropped?`All seed runs are shorter than the rolling-${W} window — `
      +"lower the smoothing.":"No reward data on this axis."}));return card;}
  appendDroppedNote(card);

  if(STATE.cmpView==="overlay"){
    // every seed its own line on one chart: colour = variant, dash = seed.
    // dash is keyed on the seed's position in the global seed list, so the
    // same seed gets the same dash in every variant even with unequal sets
    const globalSeeds=[...new Set(perGroup.flatMap(e=>e.entries.map(x=>x.seed)
      .filter(s=>s!=null)))].sort((a,b)=>+a-+b);
    const series=[];
    for(const {g,entries} of perGroup)
      entries.forEach((e,i)=>{
        const di=e.seed!=null?globalSeeds.indexOf(e.seed):i;
        series.push({
          name:`${g.label}${e.seed!=null?` · seed ${e.seed}`:""}`,color:g.color,
          dash:DASHES[di%DASHES.length],width:1.6,endLabel:false,pts:e.pts});
      });
    card.append(el("p",{class:"muted-note",
      text:"One line per seed — colour = variant, dash pattern = seed."}));
    card.append(lineChart({series,wide:true,noEndLabel:true,yLabel:yTitle,
      xLabel:cmpXLabel(),xPrefix:cmpXPrefix()}));
    return card;
  }

  // side-by-side: one panel per variant; identical axes + synced hover so the
  // panels line up point-for-point. Seed colours are consistent across panels.
  const seedList=[...new Set(perGroup.flatMap(e=>e.entries.map(x=>x.seed)
    .filter(s=>s!=null)))].sort((a,b)=>+a-+b);
  const seedColor={};seedList.forEach((s,i)=>seedColor[s]=SLOTS[i%SLOTS.length]);
  if(seedList.length){
    const leg=el("div",{class:"legend"});
    for(const s of seedList){
      const item=el("span",{class:"item fixed"});
      item.style.color=cssv(seedColor[s]);
      item.append(el("span",{class:"key"}),el("span",{class:"nm",text:"seed "+s}));
      item.querySelector(".nm").style.color="var(--ink-2)";
      leg.append(item);
    }
    card.append(leg);
  }
  const allPts=perGroup.flatMap(e=>e.entries.flatMap(x=>x.pts));
  const xDomain=[arrMin(allPts,p=>p[0]),arrMax(allPts,p=>p[0])];
  const yDomain=[arrMin(allPts,p=>p[1]),arrMax(allPts,p=>p[1])];
  const grid=el("div",{class:"grid-charts",
    style:"grid-template-columns:repeat(auto-fit,minmax(420px,1fr))"});
  for(const {g,entries} of perGroup){
    const series=entries.map((e,i)=>({
      name:e.seed!=null?`seed ${e.seed}`:e.run,
      color:e.seed!=null?seedColor[e.seed]:SLOTS[i%SLOTS.length],
      endLabel:false,pts:e.pts}));
    grid.append(lineChart({title:g.label,titleColor:g.color,series,
      xDomain,yDomain,syncKey:"cmp-reward",noEndLabel:true,yLabel:yTitle,
      xLabel:cmpXLabel(),xPrefix:cmpXPrefix()}));
  }
  card.append(grid);
  card.append(el("p",{class:"muted-note",
    text:"Panels share axes and hover — the crosshair tracks the same x in every panel."}));
  return card;
}

// ---- config diffs across selected groups ----
// The run dir's config.yaml copy is parsed as text into flat "a.b.c" -> value
// paths (indentation-based, comments stripped, "- item" lines folded into the
// parent key). No YAML library: this only needs to be faithful enough to DIFF
// configs, not to interpret them, and it degrades gracefully on exotic files.
function parseCfgPaths(text){
  const out=new Map();
  if(!text)return out;
  // pre-pass: a flow map/list ({...} or [...]) may span several physical
  // lines — merge them into one logical line, or the continuation would be
  // misparsed as a standalone "key: value" and mint phantom config paths
  const logical=[];
  let pend=null,depth=0;
  for(const raw of text.split(/\r?\n/)){
    if(pend==null&&(!raw.trim()||raw.trim().startsWith("#")))continue;
    const line=raw.replace(/\s+#.*$/,"");    // strip inline comments
    if(pend==null&&!line.trim())continue;
    const net=(line.match(/[{[]/g)||[]).length-(line.match(/[}\]]/g)||[]).length;
    if(pend==null){pend=line;depth=net;}
    else{pend+=" "+line.trim();depth+=net;}
    if(depth<=0){if(pend.trim())logical.push(pend);pend=null;depth=0;}
  }
  if(pend!=null&&pend.trim())logical.push(pend);
  const stack=[];                            // open mapping keys: {indent,key}
  for(const line of logical){
    const indent=line.match(/^ */)[0].length;
    const t=line.trim();
    while(stack.length&&stack[stack.length-1].indent>=indent)stack.pop();
    if(t.startsWith("- ")||t==="-"){         // list item -> append to parent
      const path=stack.map(s=>s.key).join(".");
      const item=t.replace(/^-\s*/,"");
      out.set(path,out.has(path)?out.get(path)+", "+item:item);
      continue;
    }
    const m=t.match(/^([^:]+):\s*(.*)$/);
    if(!m)continue;
    const key=m[1].trim();
    const path=[...stack.map(s=>s.key),key].join(".");
    if(m[2]==="")stack.push({indent,key});   // opens a nested mapping (or list)
    else out.set(path,m[2].trim());
  }
  return out;
}
// value comparison that survives YAML/JSON spelling differences (0.0 vs 0,
// True vs true vs on, quoted vs bare strings)
const CFG_BOOL={on:"true",yes:"true",off:"false",no:"false"};
function cfgNorm(v){
  const s=String(v).trim().replace(/^['"]|['"]$/g,"");
  const n=Number(s);
  if(s!==""&&Number.isFinite(n))return String(n);
  const low=s.toLowerCase();
  return CFG_BOOL[low]||low;
}
// paths that differ between runs of the SAME variant (name, seed, device) and
// would flood the table with non-differences
const CFG_SKIP=/^experiment\.(name|seed|seeds|device|save_artifacts)$/;
function cmpConfigCard(loaded){
  if(loaded.length<2)return null;
  const maps=loaded.map(g=>{
    const s=g.sums.find(x=>x&&x.config);
    const m=parseCfgPaths(s&&s.config);
    // the config copy does NOT reflect the arm's overrides — overlay them.
    // Raw String(v), not fmtOverride: booleans must stay "true"/"false" so an
    // override that merely restates the config value compares equal to the
    // YAML's True/False instead of minting a spurious diff row
    if(g.overrides)for(const [k,v] of Object.entries(g.overrides))
      m.set("agent."+k,String(v));
    return m;
  });
  const keys=[...new Set(maps.flatMap(m=>[...m.keys()]))].sort();
  const rows=[];
  for(const k of keys){
    if(CFG_SKIP.test(k))continue;
    const vals=maps.map(m=>m.has(k)?String(m.get(k)):null);
    if(new Set(vals.map(v=>v==null?"∅":cfgNorm(v))).size>1)
      rows.push([k,vals]);
  }
  const card=el("div",{class:"card"});
  card.append(el("h2",{text:"Configuration differences"}),
    el("p",{class:"desc",text:"Every config parameter that differs between the "
      +"selected variants — the run dirs' config.yaml copies plus each arm's "
      +"manifest-recorded overrides (which the copies do not reflect). "
      +"Identical parameters are hidden."}));
  if(!rows.length){
    card.append(el("p",{class:"muted-note",
      text:"No configuration differences found between the selected variants "
        +"(beyond name/seed bookkeeping)."}));
    return card;
  }
  const tbl=el("table",{});
  const hr=el("tr",{},el("th",{text:"parameter"}));
  for(const g of loaded){
    const th=el("th",{});
    const dot=el("span",{class:"dot"});dot.style.background=cssv(g.color);
    th.append(dot,document.createTextNode(g.label));
    hr.append(th);
  }
  tbl.append(hr);
  for(const [k,vals] of rows){
    const present=vals.filter(v=>v!=null);
    const common=present.length?present.map(cfgNorm)
      .sort((a,b)=>present.map(cfgNorm).filter(x=>x===a).length
                  -present.map(cfgNorm).filter(x=>x===b).length).pop():null;
    const tr=el("tr",{},el("td",{text:k}));
    for(const v of vals){
      const td=el("td",{text:v==null?"—":v});
      if(v!=null&&cfgNorm(v)!==common)td.classList.add("chg");
      tr.append(td);
    }
    tbl.append(tr);
  }
  card.append(el("div",{class:"difftbl"},tbl));
  return card;
}

function renderCompare(){
  resetChartRegistries();
  stopPlay();
  const app=$("#app");app.innerHTML="";
  const groups=runGroups();
  migrateCmpSel(groups);

  const selCard=el("div",{class:"card"});
  selCard.append(el("h2",{text:"Compare experiments"}),
    el("p",{class:"desc",text:"Pick the variants to overlay. Manifest-tracked "
      +"arms group by their true arm and seeds and show the config diff they "
      +"trained with; other runs group by run id with the seed and timestamp "
      +"stripped. Baseline first, then experiments in descending order. "
      +"Double-click a name to rename it everywhere (charts, exports)."}));
  let curExp=null,list=null;
  for(const g of groups){
    if(g.exp!==curExp){                       // one section per experiment dir
      curExp=g.exp;
      const inExp=groups.filter(x=>x.exp===curExp);
      const btn=el("button",{text:inExp.every(x=>STATE.cmpSel.has(x.key))?"none":"all",
        title:"Select or clear every variant in this experiment"});
      btn.onclick=()=>{
        const on=!inExp.every(x=>STATE.cmpSel.has(x.key));
        for(const x of inExp)on?STATE.cmpSel.add(x.key):STATE.cmpSel.delete(x.key);
        saveCmpSel();cmpLoad();
      };
      selCard.append(el("div",{class:"cmp-sec"},el("h3",{text:curExp}),btn));
      list=el("div",{class:"cmp-list"});
      selCard.append(list);
    }
    const cb=el("input",{type:"checkbox"});
    cb.checked=STATE.cmpSel.has(g.key);
    cb.onchange=()=>{
      cb.checked?STATE.cmpSel.add(g.key):STATE.cmpSel.delete(g.key);
      saveCmpSel();cmpLoad();
    };
    const seeds=groupSeeds(g);
    const nm=el("span",{class:"nm",text:g.label});
    // clicking the name (de)selects like the rest of the row; dblclick renames
    makeEditable(nm,"g:"+g.key,g.autoLabel,{onClick:()=>cb.click()});
    const head=el("div",{},nm);
    if(g.untracked)head.append(el("span",{class:"badge warn",text:"not in manifest",
      title:"Not (yet) listed in the experiment's manifest: either still "
        +"training (the launcher records a run when it finishes), superseded "
        +"by a retrain, or written by another tool. Kept out of the tracked "
        +"arms' seed averages either way."}));
    const body=el("span",{},head);
    if(g.arm&&g.overrides&&Object.keys(g.overrides).length&&g.arm!=="baseline")
      body.append(el("div",{class:"diff",text:fmtOverrides(g.overrides)}));
    const nActive=groupActiveRuns(g).length;
    body.append(el("div",{class:"meta",text:
      `${g.runs.length} run${g.runs.length>1?"s":""}`
      +(nActive<g.runs.length
        ?` (${g.runs.length-nActive} stale same-seed duplicate${g.runs.length-nActive>1?"s":""} ignored)`:"")
      +(seeds.length?` · seeds ${seeds.join(", ")}`:"")
      +(g.mtime?` · updated ${new Date(g.mtime*1000).toLocaleDateString()}`:"")}));
    list.append(el("label",{class:"cmp-item"},cb,body));
  }
  if(STATE.cmpStatus)
    selCard.append(el("p",{class:"muted-note",id:"cmpstatus",text:STATE.cmpStatus}));
  app.append(selCard);

  const sel=groups.filter(g=>STATE.cmpSel.has(g.key));
  sel.forEach((g,i)=>{
    g.color=SLOTS[i%SLOTS.length];
    g.sums=groupActiveRuns(g).map(r=>STATE.cmpCache[r.exp+"::"+r.run]).filter(Boolean);
  });
  const loaded=sel.filter(g=>g.sums.length);
  if(!loaded.length){
    if(!STATE.cmpStatus)app.append(el("div",{class:"empty"},
      "Select experiments above to overlay their seed-averaged metrics."));
    return;
  }

  // env-step availability across the loaded runs decides the default x-axis
  const allSums=loaded.flatMap(g=>g.sums);
  const nSteps=allSums.filter(s=>sumStepsOf(s)).length;
  if(STATE.cmpX==null)STATE.cmpX=nSteps===allSums.length&&nSteps>0?"steps":"ep";
  if(STATE.cmpX==="steps"&&!nSteps)STATE.cmpX="ep";

  // shared legend — click to hide/show a variant in every chart, double-click
  // the name to rename it (renames persist and flow into exports)
  const bar=el("div",{class:"legend"});
  for(const g of loaded){
    const item=el("span",{class:"item"+(STATE.cmpHidden.has(g.key)?" off":"")});
    item.style.color=cssv(g.color);
    const toggle=()=>{
      STATE.cmpHidden.has(g.key)?STATE.cmpHidden.delete(g.key)
                                :STATE.cmpHidden.add(g.key);
      rerender();
    };
    const nm=el("span",{class:"nm",text:g.label});
    nm.style.color="var(--ink-2)";
    makeEditable(nm,"g:"+g.key,g.autoLabel,{onClick:toggle});
    const count=el("span",{class:"nm",
      text:` (${g.sums.length} seed${g.sums.length>1?"s":""})`});
    count.style.color="var(--ink-2)";
    item.append(el("span",{class:"key"}),nm,count);
    item.onclick=toggle;
    bar.append(item);
  }
  const legCard=el("div",{class:"card"});
  legCard.append(bar,cmpControls(nSteps>0));
  legCard.append(el("p",{class:"muted-note",text:{
    mean:"Line = mean across seeds · band = min–max across seeds. Click a name "
      +"to toggle it in every chart.",
    overlay:"Reward chart draws every seed as its own line; the metric charts "
      +"below stay seed-averaged. Click a name to toggle a variant everywhere.",
    side:"Reward panels sit side by side with identical axes and synced hover; "
      +"the metric charts below stay seed-averaged. Click a name to toggle a "
      +"variant everywhere."}[STATE.cmpView]}));
  if(STATE.cmpX==="steps"){
    const nDer=allSums.filter(s=>sumStepsOf(s)&&s.steps_source==="derived").length;
    const nMiss=allSums.length-nSteps;
    const notes=[];
    if(nDer)notes.push(`${nDer} run(s) predate the steps column — env steps `
      +"derived from |reward| (exact for CartPole/MountainCar, ±1 per episode on Acrobot)");
    if(nMiss)notes.push(`${nMiss} run(s) have no env-step data and are hidden on this axis`);
    if(notes.length)legCard.append(el("p",{class:"muted-note",text:notes.join(" · ")}));
  }
  app.append(legCard);

  const diffCard=cmpConfigCard(loaded);
  if(diffCard)app.append(diffCard);

  app.append(cmpRewardCard(loaded));

  const diagCols=[...new Set(loaded.flatMap(g=>g.sums.flatMap(
    s=>s.diag?s.diag.columns.filter(c=>c!=="episode"):[])))]
    .sort((a,b)=>{
      const ia=DIAG_ORDER.indexOf(a),ib=DIAG_ORDER.indexOf(b);
      return (ia<0?DIAG_ORDER.length:ia)-(ib<0?DIAG_ORDER.length:ib)||a.localeCompare(b);
    });
  if(diagCols.length){
    const c=el("div",{class:"card"});
    c.append(el("h2",{text:"Training diagnostics"}),
      el("p",{class:"desc",text:"Per-train() diagnostics (train_diagnostics.csv), "
        +"averaged per episode within each run, then across seeds. A variant that "
        +"never logs a column simply has no line in that chart."}));
    const grid=el("div",{class:"grid-charts"});
    for(const col of diagCols){
      const series=cmpSeries(loaded,s=>tableSeries(s.diag,null,col));
      if(series.length)grid.append(lineChart({title:col,hint:DIAG_HINTS[col]||"",
        series,noEndLabel:true,xLabel:cmpXLabel(),xPrefix:cmpXPrefix()}));
    }
    c.append(grid);
    app.append(c);
  }

  const statsCard=cmpMatrixCard(loaded,"stats","cmpStatsMatrix",
    "Rank metrics over training",
    "Generic per-matrix analysis (rank_stats.csv) for one analysed matrix, seed-averaged.");
  if(statsCard)app.append(statsCard);

  const sweepCard=cmpMatrixCard(loaded,"sweep_evo","cmpSweepMatrix",
    "Hankel sweep evolution",
    "hankel_sweep.csv at full rollout length: averaged over rollouts within each "
      +"run, then across seeds.");
  if(sweepCard)app.append(sweepCard);
}

const CHARTS=[];
const EP_HOOKS=[];
// charts sharing a syncKey mirror each other's hover crosshair + tooltip —
// side-by-side seed panels stay comparable point-for-point. Reset per render.
const HOVER_SYNC={};
function resetChartRegistries(){
  CHARTS.length=0;EP_HOOKS.length=0;
  for(const k in HOVER_SYNC)delete HOVER_SYNC[k];
}
function syncMarkers(ep){for(const c of CHARTS)c.marker(ep);for(const h of EP_HOOKS)h(ep);}

// ================= CHART EXPORT (SVG / PNG for publications) =================
// Every chart gets hover buttons that download it as a standalone figure:
// vector SVG or 3× PNG, always in the light palette (independent of the
// on-screen theme), with a title + legend header, axis labels on both axes,
// and every CSS variable and class style inlined so the file renders anywhere.
const EXPORT_FONT="Helvetica, Arial, sans-serif";
function slugify(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"").slice(0,60)||"chart";
}
function dlBlob(blob,name){
  const a=el("a",{href:URL.createObjectURL(blob),download:name});
  document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
}
// literal-ize var(--x) colours and class-styled text (standalone SVGs carry no
// page CSS). Must run while the light theme is active so cssv() gives print
// colours.
function inlineSvgStyles(node){
  for(const e of [node,...node.querySelectorAll("*")]){
    for(const attr of ["stroke","fill"]){
      const v=e.getAttribute&&e.getAttribute(attr);
      if(v&&v.startsWith("var("))e.setAttribute(attr,cssv(v.slice(4,-1).trim())||"#888888");
    }
    if(e.tagName==="text"){
      const cls=e.getAttribute("class")||"";
      if(cls.includes("end-lab")){
        e.setAttribute("fill","#333333");e.setAttribute("font-size","11");
        e.setAttribute("font-weight","600");
      }else if(cls.includes("axis-txt")||cls.includes("axis-lab")){
        e.setAttribute("fill","#555555");e.setAttribute("font-size","11");
      }
      e.removeAttribute("class");
    }
  }
}
function buildExportSvg(box){
  const opts=box._opts, meta=box._meta;
  if(!opts||!meta)return null;
  const root=document.documentElement;
  const hadTheme="theme" in root.dataset, prevTheme=root.dataset.theme;
  root.dataset.theme="light";
  let svg,legendItems;
  try{
    const rebuilt=lineChart({...opts,_export:true});
    svg=rebuilt.querySelector("svg");
    if(!svg)return null;
    for(const n of svg.querySelectorAll("[data-noexport]"))n.remove();
    inlineSvgStyles(svg);
    legendItems=meta.series.map(s=>({name:s.name,dash:s.dash,
      color:!s.color?"#888888"
        :s.color.startsWith("--seq:")?seqColor(parseFloat(s.color.slice(6)))
        :s.color.startsWith("--")?(cssv(s.color)||"#888888"):s.color}));
  }finally{
    if(hadTheme)root.dataset.theme=prevTheme; else delete root.dataset.theme;
  }
  const vb=svg.getAttribute("viewBox").split(/\s+/).map(Number);
  const W=vb[2],H=vb[3];
  const padX=16,gx=18,extraW=gx+30;         // breathing room: y-label + end labels
  const ctx=document.createElement("canvas").getContext("2d");
  ctx.font="12px "+EXPORT_FONT;
  // header: title, wrapped legend rows, optional band note
  let headerH=10;
  if(meta.title)headerH+=24;
  const showLegend=legendItems.length>1;
  const rows=[];
  if(showLegend){
    let row=[],x=padX;
    for(const it of legendItems){
      const w=26+ctx.measureText(it.name).width+18;
      if(x+w>W+extraW-padX&&row.length){rows.push(row);row=[];x=padX;}
      it.x=x;row.push(it);x+=w;
    }
    if(row.length)rows.push(row);
    headerH+=rows.length*20;
  }
  if(meta.band)headerH+=18;
  headerH+=4;

  const NS="http://www.w3.org/2000/svg";
  const mkx=(t,a)=>{const n=document.createElementNS(NS,t);
    for(const k in a)n.setAttribute(k,a[k]);return n;};
  const out=mkx("svg",{xmlns:NS,width:W+extraW,height:H+headerH,
    viewBox:`0 0 ${W+extraW} ${H+headerH}`,"font-family":EXPORT_FONT});
  out.append(mkx("rect",{x:0,y:0,width:W+extraW,height:H+headerH,fill:"#ffffff"}));
  let y=10;
  if(meta.title){
    const t=mkx("text",{x:padX,y:y+15,"font-size":"15","font-weight":"700",fill:"#111111"});
    t.textContent=meta.title;out.append(t);y+=24;
  }
  if(showLegend){
    for(const row of rows){
      for(const it of row){
        const ln=mkx("line",{x1:it.x,x2:it.x+18,y1:y+9,y2:y+9,
          stroke:it.color,"stroke-width":2.5});
        if(it.dash)ln.setAttribute("stroke-dasharray",it.dash);
        out.append(ln);
        const t=mkx("text",{x:it.x+24,y:y+13,"font-size":"12",fill:"#333333"});
        t.textContent=it.name;out.append(t);
      }
      y+=20;
    }
  }
  if(meta.band){
    const t=mkx("text",{x:padX,y:y+12,"font-size":"11",fill:"#666666",
      "font-style":"italic"});
    t.textContent="shaded band = min–max range";out.append(t);y+=18;
  }
  const g=mkx("g",{transform:`translate(${gx},${headerH})`});
  while(svg.firstChild)g.append(svg.firstChild);
  out.append(g);
  if(meta.yLabel){
    const cy=headerH+12+(H-34-12)/2;        // centred on the plot band (m.t..H-m.b)
    const t=mkx("text",{"font-size":"11.5",fill:"#555555","text-anchor":"middle",
      transform:`translate(12 ${cy}) rotate(-90)`});
    t.textContent=meta.yLabel;out.append(t);
  }
  return {node:out,w:W+extraW,h:H+headerH};
}
function serializeSvg(node){
  return '<?xml version="1.0" encoding="UTF-8"?>\n'
    +new XMLSerializer().serializeToString(node);
}
async function svgToPngBlob(text,w,h,scale){
  const url=URL.createObjectURL(new Blob([text],{type:"image/svg+xml;charset=utf-8"}));
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;
      img.onerror=()=>rej(new Error("SVG rasterisation failed"));img.src=url;});
    const c=document.createElement("canvas");
    c.width=Math.round(w*scale);c.height=Math.round(h*scale);
    const cx=c.getContext("2d");
    cx.fillStyle="#ffffff";cx.fillRect(0,0,c.width,c.height);
    cx.drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(res,"image/png"));
  }finally{URL.revokeObjectURL(url);}
}
async function exportChart(box,fmt){
  try{
    const built=buildExportSvg(box);
    if(!built)return;
    const base=slugify(box._meta.title||box._meta.yLabel||"chart")
      +"__"+slugify(STATE.compare?"compare":(STATE.cur?STATE.cur.run:"run"));
    const text=serializeSvg(built.node);
    if(fmt==="svg"){
      dlBlob(new Blob([text],{type:"image/svg+xml"}),base+".svg");
      return;
    }
    const blob=await svgToPngBlob(text,built.w,built.h,3);
    if(blob)dlBlob(blob,base+".png");
    else throw new Error("PNG encoding failed");
  }catch(err){
    console.error("chart export failed",err);
    alert("Chart export failed: "+(err&&err.message||err));
  }
}

function lineChart(opts){
  const {title,titleColor,hint,wide,noEndLabel,episodeAxis,xLabel,xPrefix,
         xDomain,yDomain,syncKey,yLabel,yLog,markers,_export}=opts;
  // a log axis can only place strictly-positive values — drop the rest up
  // front so domains, paths and hover all agree (opts.series stays untouched:
  // the export path rebuilds from it)
  const series=yLog?opts.series.map(s=>({...s,
    pts:s.pts.filter(p=>p[1]>0),
    band:s.band&&s.band.filter(b=>b[1]>0&&b[2]>0)})):opts.series;
  const W=opts.size?opts.size[0]:(wide?960:440),
        H=opts.size?opts.size[1]:(wide?300:230);
  const anyEnd=!noEndLabel&&series.some(s=>s.endLabel!==false);
  const m={l:56,r:anyEnd?70:16,t:12,b:34};
  const box=el("div",{class:"chart"});
  const tDisp=title?lbl("t:"+title,title):"";
  if(title&&!_export){
    const ct=el("p",{class:"ct"});
    if(titleColor){const dot=el("span",{class:"dot"});dot.style.background=cssv(titleColor);ct.append(dot);}
    const tspan=el("span",{text:tDisp});
    makeEditable(tspan,"t:"+title,title);
    ct.append(tspan);
    box.append(ct);
  }
  if(hint&&!_export)box.append(el("p",{class:"ch",text:hint}));
  const tip=el("div",{class:"tip"});

  const all=series.flatMap(s=>s.pts);
  if(!all.length){box.append(el("p",{class:"muted-note",text:"no data"}));return box;}
  let xmin=arrMin(all,p=>p[0]), xmax=arrMax(all,p=>p[0]);
  let ymin=arrMin(all,p=>p[1]), ymax=arrMax(all,p=>p[1]);
  for(const s of series)if(s.band)for(const b of s.band){
    ymin=Math.min(ymin,b[1]);ymax=Math.max(ymax,b[2]);}
  // caller-shared domains (side-by-side panels must line up exactly)
  if(xDomain){xmin=xDomain[0];xmax=xDomain[1];}
  if(yDomain){ymin=yDomain[0];ymax=yDomain[1];}
  if(xmax===xmin)xmax=xmin+1;
  let Y,yt;
  if(yLog){
    let l0=Math.log10(ymin),l1=Math.log10(ymax);
    const lp=Math.max((l1-l0)*0.06,0.12); l0-=lp; l1+=lp;
    Y=v=>H-m.b-(Math.log10(v)-l0)/(l1-l0)*(H-m.t-m.b);
    yt=logTicks(l0,l1);
  }else{
    if(ymax===ymin){ymax+=1;ymin-=1;}
    const pad=(ymax-ymin)*0.08; ymax+=pad; ymin-=pad;
    if(ymin>0&&ymin-pad<0)ymin=Math.max(0,ymin);
    Y=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b);
    yt=ticks(ymin,ymax,4);
  }
  const X=v=>m.l+(v-xmin)/(xmax-xmin)*(W-m.l-m.r);

  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  const col=s=>!s.color?s.color
    :s.color.startsWith("--seq:")?seqColor(parseFloat(s.color.slice(6)))
    :s.color.startsWith("--")?cssv(s.color):s.color;

  // y gridlines + ticks
  for(const v of yt){
    svg.append(mk("line",{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:"var(--grid)","stroke-width":1}));
    const t=mk("text",{x:m.l-8,y:Y(v)+3,"text-anchor":"end",class:"axis-txt"});
    t.textContent=yLog?fmtLog(v):fmtN(v);svg.append(t);
  }
  // x ticks + axis label
  for(const v of ticks(xmin,xmax,wide?6:4)){
    const t=mk("text",{x:X(v),y:H-16,"text-anchor":"middle",class:"axis-txt"});
    t.textContent=fmtSteps(v);svg.append(t);
  }
  if(xLabel){
    const t=mk("text",{x:W-m.r,y:H-2,"text-anchor":"end",class:"axis-lab"});
    t.textContent=xLabel;svg.append(t);
  }
  svg.append(mk("line",{x1:m.l,x2:W-m.r,y1:H-m.b,y2:H-m.b,stroke:"var(--axis)","stroke-width":1}));

  // marker line (synced to scrubber; only meaningful on episode-axis charts)
  const marker=mk("line",{x1:-99,x2:-99,y1:m.t,y2:H-m.b,stroke:"var(--axis)",
    "stroke-width":1.5,"stroke-dasharray":"4 4",opacity:.9,"data-noexport":"1"});
  svg.append(marker);

  // min–max bands first (under the lines)
  for(const s of series){
    if(!s.band||s.band.length<2)continue;
    const c=col(s);
    let d="";
    s.band.forEach((b,i)=>{d+=(i?"L":"M")+X(b[0]).toFixed(1)+" "+Y(b[2]).toFixed(1)+" ";});
    for(let i=s.band.length-1;i>=0;i--)d+="L"+X(s.band[i][0]).toFixed(1)+" "+Y(s.band[i][1]).toFixed(1)+" ";
    svg.append(mk("path",{d:d+"Z",fill:c,opacity:.13,stroke:"none"}));
  }

  // series paths + end dots/labels
  const ends=[];
  for(const s of series){
    const c=col(s);
    let dstr="";
    s.pts.forEach((p,i)=>{dstr+=(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)+" ";});
    const attrs={d:dstr,fill:"none",stroke:c,"stroke-width":s.width??2,
      "stroke-linejoin":"round","stroke-linecap":"round"};
    if(s.opacity!=null)attrs.opacity=s.opacity;
    if(s.dash)attrs["stroke-dasharray"]=s.dash;
    svg.append(mk("path",attrs));
    if(markers&&s.markers!==false){ // per-point marks (scree-style charts)
      for(const p of s.pts)
        svg.append(mk("circle",{cx:X(p[0]),cy:Y(p[1]),r:2.8,fill:c,
          stroke:"var(--surface)","stroke-width":1,opacity:s.opacity??1}));
    }else if(s.pts.length===1){ // single-point series still gets a visible mark
      svg.append(mk("circle",{cx:X(s.pts[0][0]),cy:Y(s.pts[0][1]),r:3.5,fill:c,
        opacity:s.opacity??1}));
    }
    if(!noEndLabel&&s.endLabel!==false){
      const last=s.pts[s.pts.length-1];
      ends.push({s,x:X(last[0]),y:Y(last[1]),col:c});
    }
  }
  ends.sort((a,b)=>a.y-b.y);
  let prevY=-1e9;
  for(const e of ends){
    svg.append(mk("circle",{cx:e.x,cy:e.y,r:4,fill:e.col,stroke:"var(--surface)","stroke-width":2}));
    let ly=e.y+3; if(ly-prevY<12)ly=prevY+12; prevY=ly;
    const t=mk("text",{x:e.x+8,y:ly,class:"end-lab"});t.textContent=dn(e.s.name);svg.append(t);
  }

  // hover crosshair + tooltip (hover-enabled series only)
  const hoverSeries=series.filter(s=>s.hover!==false);
  const cross=mk("line",{x1:-99,x2:-99,y1:m.t,y2:H-m.b,stroke:"var(--axis)","stroke-width":1,opacity:0,"data-noexport":"1"});
  svg.append(cross);
  const hoverDots=mk("g",{"data-noexport":"1"});svg.append(hoverDots);
  const overlay=mk("rect",{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:"transparent","data-noexport":"1"});
  svg.append(overlay);

  const xs=[...new Set(hoverSeries.flatMap(s=>s.pts.map(p=>p[0])))].sort((a,b)=>a-b);
  // nearest point of one series to x value xv (pts are sorted by x)
  function nearestPt(pts,xv){
    let a=0,b=pts.length-1;
    while(b-a>1){const mid=(a+b)>>1;(pts[mid][0]<=xv)?a=mid:b=mid;}
    return Math.abs(pts[a][0]-xv)<=Math.abs(pts[b][0]-xv)?pts[a]:pts[b];
  }
  function showAt(xv){
    if(!xs.length)return;
    const r=svg.getBoundingClientRect();
    let near=xs[0]; for(const x of xs)if(Math.abs(x-xv)<Math.abs(near-xv))near=x;
    cross.setAttribute("x1",X(near));cross.setAttribute("x2",X(near));cross.setAttribute("opacity",.7);
    hoverDots.innerHTML="";
    const rows=[];
    // per-series nearest within a 1%-of-span tolerance: seed curves on an
    // env-steps axis never share exact x values, but should all report
    const tol=(xmax-xmin)/100;
    for(const s of hoverSeries){
      if(!s.pts.length)continue;
      const p=nearestPt(s.pts,near);
      if(p[0]!==near&&Math.abs(p[0]-near)>tol)continue;
      const c=col(s);
      hoverDots.append(mk("circle",{cx:X(p[0]),cy:Y(p[1]),r:4,fill:c,
        stroke:"var(--surface)","stroke-width":2}));
      let extra="";
      if(s.band){const b=s.band.find(q=>q[0]===p[0]);
        if(b)extra=`  (${fmtN(b[1])}–${fmtN(b[2])})`;}
      rows.push({name:dn(s.name),color:c,v:fmtN(p[1])+extra});
    }
    tip.innerHTML="";
    tip.append(el("div",{class:"tep",text:(xPrefix||((xLabel||"x")+" "))
      +(Number.isInteger(near)?near.toLocaleString():fmtN(near))}));
    for(const rw of rows){
      const row=el("div",{class:"row"});row.style.color=rw.color;
      row.append(el("span",{class:"k"}),
        el("span",{class:"nm",text:rw.name}),
        el("span",{class:"v",text:rw.v}));
      row.querySelector(".nm").style.color="var(--ink-2)";
      tip.append(row);
    }
    tip.style.opacity=1;
    let tx=(X(near)/W)*r.width+12; if(tx>r.width-150)tx=(X(near)/W)*r.width-150;
    tip.style.left=Math.max(0,tx)+"px"; tip.style.top="6px";
  }
  function hideHover(){cross.setAttribute("opacity",0);hoverDots.innerHTML="";tip.style.opacity=0;}
  overlay.addEventListener("pointermove",ev=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W;
    const xv=xmin+(px-m.l)/(W-m.l-m.r)*(xmax-xmin);
    if(syncKey)for(const h of HOVER_SYNC[syncKey]||[])h.showAt(xv);
    else showAt(xv);
  });
  overlay.addEventListener("pointerleave",()=>{
    if(syncKey)for(const h of HOVER_SYNC[syncKey]||[])h.hide();
    else hideHover();
  });
  if(syncKey&&!_export)(HOVER_SYNC[syncKey]=HOVER_SYNC[syncKey]||[]).push({showAt,hide:hideHover});

  box.append(svg,tip);
  // Optional inset panel: opts.inset is a full lineChart opts object for the
  // small chart, opts.insetPos = [x, y, w] in THIS chart's viewBox units (the
  // height follows from the inset's own aspect ratio). On screen it renders
  // as its own interactive chart %-positioned over the empty region — the
  // host chart must then have no title/hint, so the svg is the box's only
  // flow content and percentages line up. On export it is embedded as a
  // nested <svg>, so the downloaded figure keeps the inset.
  if(opts.inset&&opts.insetPos){
    const [ix,iy,iw]=opts.insetPos;
    const iW=opts.inset.size?opts.inset.size[0]:440,
          iH=opts.inset.size?opts.inset.size[1]:230;
    const ih=iw*iH/iW;
    if(_export){
      const inner=lineChart({...opts.inset,_export:true}).querySelector("svg");
      if(inner){
        inner.setAttribute("x",ix);inner.setAttribute("y",iy);
        inner.setAttribute("width",iw);inner.setAttribute("height",ih);
        svg.append(mk("rect",{x:ix-4,y:iy-4,width:iw+8,height:ih+8,rx:4,
          fill:"var(--surface)",stroke:"var(--axis)","stroke-width":1}));
        svg.append(inner);
      }
    }else{
      const inner=lineChart(opts.inset);
      inner.classList.add("spec-inset");
      inner.style.left=(ix/W*100)+"%";
      inner.style.top=(iy/H*100)+"%";
      inner.style.width=(iw/W*100)+"%";
      box.append(inner);
    }
  }
  // scrubber-synced marker: on episode axes directly, on re-based axes via the
  // caller's episode -> x mapping (opts.epToX), so e.g. the learning curve on
  // env steps still tracks the episode selected in the spectra scrubber
  if((episodeAxis||opts.epToX)&&!_export)
    CHARTS.push({marker:ep=>{
      const x=opts.epToX?opts.epToX(ep):ep;
      if(x!=null&&x>=xmin&&x<=xmax){marker.setAttribute("x1",X(x));marker.setAttribute("x2",X(x));}
      else{marker.setAttribute("x1",-99);marker.setAttribute("x2",-99);}}});
  if(!_export){
    // publication export: keep everything the rebuild needs, plus the labels
    // as currently displayed (double-click renames included)
    box._opts=opts;
    box._meta={title:tDisp,xLabel:xLabel||"",yLabel:yLabel||tDisp||"",
      band:series.some(s=>s.band&&s.band.length>1),
      series:series.map(s=>({name:dn(s.name),color:s.color,dash:s.dash||""}))};
    const bSvg=el("button",{text:"⬇ SVG",title:"Download as vector SVG (publication-ready)"});
    const bPng=el("button",{text:"⬇ PNG",title:"Download as high-resolution PNG (3×)"});
    bSvg.onclick=e=>{e.stopPropagation();exportChart(box,"svg");};
    bPng.onclick=e=>{e.stopPropagation();exportChart(box,"png");};
    box.append(el("div",{class:"expbtns"},bSvg,bPng));
  }
  return box;
}

// log-axis tick labels: powers of ten as unicode superscripts, anything else
// (the sub-decade fallback ticks) via fmtN
const SUP_DIGITS={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴",
  "5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function fmtLog(v){
  const k=Math.log10(v),r=Math.round(k);
  if(Math.abs(k-r)<1e-6)return "10"+String(r).replace(/[-\d]/g,c=>SUP_DIGITS[c]);
  return fmtN(v);
}
// decade tick values for a log10 axis over [l0,l1] (log-space bounds); under
// two decades of span, fall back to 1/2/5-per-decade ticks
function logTicks(l0,l1){
  let out=[];
  for(let k=Math.ceil(l0-1e-9);k<=Math.floor(l1+1e-9);k++)out.push(Math.pow(10,k));
  if(out.length>=2)return out;
  for(let k=Math.floor(l0)-1;k<=Math.ceil(l1);k++)
    for(const f of [1,2,5]){
      const v=f*Math.pow(10,k),lv=Math.log10(v);
      if(lv>=l0-1e-9&&lv<=l1+1e-9)out.push(v);
    }
  out=[...new Set(out)].sort((a,b)=>a-b);
  return out;
}

function ticks(lo,hi,n){
  const span=hi-lo, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag; let step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  // Bounded loop: when the range is a few float-ULPs wide, v+step can round
  // back to v and the naive loop never terminates, freezing the tab.
  const out=[];
  for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9&&out.length<200;v+=step){
    out.push(+v.toFixed(6));
    if(v+step===v)break;
  }
  return out;
}

boot();
</script>
