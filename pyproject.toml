[project]
name = "low-rank-rl-tl"
version = "0.1.0"
description = "Low-Rank RL Transfer Learning thesis codebase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "gymnasium[atari,classic-control,other]>=0.29",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "ipykernel>=6.29",
    "scipy>=1.17.1",
    "ale-py>=0.12.0",
    "opencv-python>=4.13.0.92",
    "nbconvert>=7.16",
    "optuna>=4.9.0",
    "stable-baselines3>=2.9.0",
    "sb3-contrib>=2.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
